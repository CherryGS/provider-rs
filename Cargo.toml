[workspace]
resolver = "3"
members = ["crates/provider", "crates/provider-cli", "crates/domain/*", "crates/test-support"]

[workspace.dependencies]
base64 = "0.23"
bytes = "1"
hmac = "0.13"
rand = "0.10"
reqwest = { version = "0.13.4", features = ["form", "json", "query", "stream"] }
secrecy = { version = "0.10", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
time = { version = "0.3", features = ["formatting", "macros"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
provider-test-support = { path = "crates/test-support" }

[profile.dev]
opt-level = 1
debug = "line-tables-only"
debug-assertions = true
overflow-checks = true
incremental = true
lto = false
codegen-units = 256
panic = "unwind"

[profile.dev.package."*"]
opt-level = 3
debug = false

[profile.release]
opt-level = 3
debug = "line-tables-only"
debug-assertions = false
overflow-checks = false
incremental = false
lto = "thin"
codegen-units = 8
panic = "unwind"
strip = "none"

[profile.dist]
inherits = "release"
opt-level = 3
debug = "line-tables-only"
lto = "thin"
codegen-units = 1
incremental = false
panic = "unwind"
strip = "none"
