[package]
name = "provider"
version = "0.1.0"
edition = "2024"

[features]
default = ["codex"]
anthropic = ["dep:provider-anthropic"]
codex = [
    "dep:provider-codex",
    "dep:reqwest",
    "dep:serde",
    "dep:serde_json",
    "dep:tokio",
]
deepseek = ["dep:provider-deepseek"]
openai = ["dep:provider-openai"]
siliconflow = ["dep:provider-siliconflow"]
volcengine = ["dep:provider-volcengine"]

[dependencies]
provider-anthropic = { path = "../domain/anthropic", optional = true }
provider-codex = { path = "../domain/codex", optional = true }
provider-deepseek = { path = "../domain/deepseek", optional = true }
provider-openai = { path = "../domain/openai", optional = true }
provider-siliconflow = { path = "../domain/siliconflow", optional = true }
provider-volcengine = { path = "../domain/volcengine", optional = true }
reqwest = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }

[[bin]]
name = "provider"
path = "src/main.rs"
required-features = ["codex"]
